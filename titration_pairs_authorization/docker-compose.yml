services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: titration_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Хранилище активных сессий (session:<sessionId> -> пользователь)
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
